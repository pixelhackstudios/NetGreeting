<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="./ui.css">
  <style>body{display:grid;place-items:center;min-height:100vh;padding:32px;}</style>
</head>
<body>
  <div class="window">
    <div class="titlebar">NetGreeting <span class="dots"><span></span><span></span><span></span></span></div>
    <div class="menubar"><span><u>C</u>all</span><span><u>V</u>iew</span><span><u>T</u>ools</span><span><u>H</u>elp</span></div>
    <div class="body">
      <img class="video" src="../assets/helen.jpg" alt="">
      <div class="row">
        <div class="btn">Place Call</div>
        <div class="btn">End Call</div>
        <div class="btn">Directory</div>
      </div>
      <div class="banner">Helen Voss</div>
      <label class="small">Current Call / Meeting</label>
      <div class="list">Helen Voss</div>
      <div class="tools">
        <div class="iconbtn">🖥</div>
        <div class="iconbtn">💬</div>
        <div class="iconbtn">✎</div>
        <div class="iconbtn">📄</div>
      </div>
    </div>
    <div class="status">Not in a call. Waiting on the directory.</div>
  </div>
</body>
</html>
