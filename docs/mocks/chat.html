<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="./ui.css">
  <style>body{display:grid;place-items:center;min-height:100vh;padding:32px;}</style>
</head>
<body>
  <div class="window wide" style="width:440px;">
    <div class="titlebar">NetGreeting - Chat <span class="dots"><span></span><span></span><span></span></span></div>
    <div class="body">
      <div class="chatlog">
        <p>&lt;14:02:11&gt; Priya Cole: can you see my whiteboard?</p>
        <p>&lt;14:02:18&gt; Sam Okada: yes — love the blue arrow</p>
        <p class="whisper">&lt;14:02:41&gt; Helen Voss (whisper): I’ll send the file in a second</p>
        <p>&lt;14:02:55&gt; Priya Cole: hang on, cat incoming</p>
      </div>
      <div class="inputrow" style="margin-top:8px;">
        <span style="align-self:center;">Send to:</span>
        <div class="btn" style="flex:1;text-align:left;">Everyone in this meeting</div>
      </div>
      <div class="inputrow">
        <input value="ok sending now">
        <div class="btn" style="flex:0 0 70px;">Send</div>
      </div>
    </div>
  </div>
</body>
</html>
